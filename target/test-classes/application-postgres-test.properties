# ===================================================================
# Real PostgreSQL Integration Test Configuration
# Used by PostgresApiIntegrationTest for live database verification
# ===================================================================

spring.datasource.url=${POSTGRES_TEST_URL:jdbc:postgresql://${POSTGRES_TEST_HOST:localhost}:${POSTGRES_TEST_PORT:5433}/${POSTGRES_TEST_DB:ecommerce_test_db}}
spring.datasource.username=${POSTGRES_TEST_USER:postgres}
spring.datasource.password=${POSTGRES_TEST_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
