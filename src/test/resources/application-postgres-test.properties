# PostgreSQL Live Integration Test Configuration
spring.datasource.url=jdbc:postgresql://${POSTGRES_TEST_HOST:localhost}:${POSTGRES_TEST_PORT:5432}/${POSTGRES_TEST_DB:ecommerce_integration_test_db}
spring.datasource.username=${POSTGRES_TEST_USER:postgres}
spring.datasource.password=${POSTGRES_TEST_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
