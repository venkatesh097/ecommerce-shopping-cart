# ===================================================================
# E-Commerce Shopping Cart Backend Configuration
# ===================================================================

spring.application.name=ecommerce-backend
server.port=${SERVER_PORT:8080}

# ===================================================================
# Database Configuration (PostgreSQL)
# Configured via environment variables with defaults for local dev.
# Sensitive values (like passwords) are not hard-coded.
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# Jackson / JSON Formatting
# ===================================================================
spring.jackson.deserialization.fail-on-unknown-properties=false
